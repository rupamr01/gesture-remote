<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta id="theme-color" name="theme-color" content="#e9edf4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Touchpad">
    <meta name="description" content="Turn your phone into a precision trackpad for your computer.">
    <title>Touchpad — Gesture Remote</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='4' y='3' width='16' height='18' rx='5' fill='%235b6cff'/%3E%3Cpath d='M4.5 12h15' stroke='%23f4f6ff' stroke-width='1.4'/%3E%3Ccircle cx='12' cy='7.5' r='1' fill='%23f4f6ff'/%3E%3C/svg%3E">

    <script>
        // Apply a saved dark theme before the stylesheet paints, so there is
        // no bright flash when the page opens in dark mode.
        (() => {
            try {
                if (localStorage.getItem("touchpad-theme") === "dark") {
                    document.documentElement.dataset.theme = "dark";
                    document.getElementById("theme-color").content = "#20232a";
                }
            } catch (error) {
                // Storage can be blocked (private mode); light stays the default.
            }
        })();
    </script>

    <style>
        /* First paint only; the stylesheet takes over immediately after. */
        html { background: #e9edf4; }
        html[data-theme="dark"] { background: #20232a; }
    </style>

    <link rel="stylesheet" href="cursor.css?v=13">
</head>
<body>
    <div class="app">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none">
                        <rect x="4" y="3" width="16" height="18" rx="5" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M4.5 12h15" stroke="currentColor" stroke-width="1.5"/>
                        <circle cx="12" cy="7.5" r="1" fill="currentColor"/>
                    </svg>
                </span>
                <span class="brand-text">
                    <span class="eyebrow">Gesture Remote</span>
                    <h1>Touchpad</h1>
                </span>
            </div>

            <div class="top-actions">
                <button id="theme-toggle" class="icon-btn theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark mode" title="Switch to dark mode">
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M20.3 14.1A8.4 8.4 0 0 1 9.9 3.7 8.4 8.4 0 1 0 20.3 14.1Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                    </svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M12 2.9v2.2M12 18.9v2.2M21.1 12h-2.2M5.1 12H2.9M18.4 5.6l-1.5 1.5M7.1 16.9l-1.5 1.5M18.4 18.4l-1.5-1.5M7.1 7.1 5.6 5.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </button>

                <button id="screen-toggle" class="icon-btn screen-toggle" type="button" aria-pressed="false" aria-label="Show laptop screen" title="Show screen">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <rect x="3.2" y="4.2" width="17.6" height="11.6" rx="2.6" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M8.5 20h7M12 16v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </button>

                <div id="status" class="status" data-state="connecting" role="status" aria-live="polite" title="Connecting">
                    <span class="status-dot" aria-hidden="true"></span>
                    <span id="status-text">Connecting</span>
                </div>
            </div>
        </header>

        <section id="viewer" class="viewer" hidden aria-label="Live laptop screen">
            <canvas id="screen" width="960" height="540"></canvas>

            <div class="viewer-top">
                <span class="viewer-state">
                    <span class="viewer-dot" aria-hidden="true"></span>
                    <span id="viewer-state-text">Connecting</span>
                </span>

                <button id="viewer-fullscreen" class="viewer-btn" type="button" aria-label="Enter fullscreen" title="Fullscreen">
                    <svg class="icon-expand" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M8.5 3.5h-5v5M15.5 3.5h5v5M20.5 15.5v5h-5M3.5 15.5v5h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <svg class="icon-collapse" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M3.5 8.5h5v-5M20.5 8.5h-5v-5M20.5 15.5h-5v5M3.5 15.5h5v5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </section>

        <main id="pad" class="pad" aria-label="Trackpad. Drag with one finger to move, tap to click, drag with two fingers to scroll.">
            <div id="glow" class="pad-glow" aria-hidden="true"></div>

            <div class="pad-hint">
                <span class="hint-ring" aria-hidden="true"></span>
                <span class="hint-title">Touch anywhere</span>
                <span class="hint-sub">Drag to move &middot; Tap to click &middot; Hold to drag</span>
            </div>

            <span class="pad-tag" aria-hidden="true">Trackpad</span>
        </main>

        <footer class="guide" aria-label="Gesture guide">
            <div class="guide-head">
                <span class="guide-title">Gestures</span>
                <span class="guide-note">One hand is all it takes</span>
            </div>
            <div class="guide-grid">
                <div class="gesture">
                    <span class="gesture-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M5.5 4.2 18 11.4l-5.1 1.2 2.6 5.2-2.3 1.1-2.6-5.2-3.6 3.7L5.5 4.2Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                        </svg>
                    </span>
                    <span class="gesture-copy">
                        <strong>Move</strong>
                        <small>One-finger drag</small>
                    </span>
                </div>

                <div class="gesture">
                    <span class="gesture-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none">
                            <circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.4"/>
                            <path d="M7.4 16.6a6.5 6.5 0 0 1 0-9.2M16.6 7.4a6.5 6.5 0 0 1 0 9.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                        </svg>
                    </span>
                    <span class="gesture-copy">
                        <strong>Click</strong>
                        <small>Tap once</small>
                    </span>
                </div>

                <div class="gesture">
                    <span class="gesture-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M9 6.5 12 3.5l3 3M9 17.5l3 3 3-3M12 3.5v17" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                    <span class="gesture-copy">
                        <strong>Scroll</strong>
                        <small>Two-finger drag</small>
                    </span>
                </div>

                <div class="gesture">
                    <span class="gesture-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M12 3.2a6.8 6.8 0 0 0-6.8 6.8v3.2a6.8 6.8 0 0 0 13.6 0V10A6.8 6.8 0 0 0 12 3.2Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                            <path d="M12 3.2v6.4h6.8" stroke="currentColor" stroke-width="1.4"/>
                        </svg>
                    </span>
                    <span class="gesture-copy">
                        <strong>Right click</strong>
                        <small>Two-finger tap</small>
                    </span>
                </div>
            </div>
        </footer>
    </div>

    <script src="cursor.js?v=13"></script>
</body>
</html>
