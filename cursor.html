<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#f4f2ed">
    <title>Touchpad — Gesture Remote</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="cursor.css">
</head>
<body>
    <main id="pad">
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none">
                        <rect x="4" y="3" width="16" height="18" rx="5" stroke="currentColor" stroke-width="1.6"/>
                        <path d="M4.5 12h15" stroke="currentColor" stroke-width="1.6"/>
                        <circle cx="12" cy="7.5" r="1" fill="currentColor"/>
                    </svg>
                </div>
                <div>
                    <span class="eyebrow">GESTURE REMOTE</span>
                    <h1>Touchpad</h1>
                </div>
            </div>
            <div id="status" class="status-badge" role="status" aria-live="polite">Connecting...</div>
        </header>

        <section class="touch-surface" aria-label="Trackpad control area">
            <div class="surface-content" aria-hidden="true">
                <div class="surface-icon">
                    <svg viewBox="0 0 32 32" fill="none">
                        <path d="M12 16V9.5a2 2 0 0 1 4 0V15m0-3a2 2 0 0 1 4 0v4m0-2a2 2 0 0 1 4 0v5a8 8 0 0 1-8 8h-1a8 8 0 0 1-6.7-3.6L5.8 20a2 2 0 0 1 3.2-2.4l3 3.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <span class="surface-label">YOUR TRACKPAD</span>
                <p>Touch anywhere to control your cursor</p>
            </div>
            <span class="surface-corner corner-top" aria-hidden="true"></span>
            <span class="surface-corner corner-bottom" aria-hidden="true"></span>
        </section>

        <footer class="gesture-guide" aria-label="Touch gestures">
            <div class="guide-heading">
                <span class="eyebrow">QUICK GUIDE</span>
                <span class="guide-note">Simple gestures, seamless control</span>
            </div>
            <div class="gesture-list">
                <div class="gesture-item">
                    <span class="gesture-number">01</span>
                    <span><strong>Move cursor</strong><small>Drag with one finger</small></span>
                </div>
                <div class="gesture-item">
                    <span class="gesture-number">02</span>
                    <span><strong>Click &amp; select</strong><small>Tap to click · double tap to select</small></span>
                </div>
                <div class="gesture-item">
                    <span class="gesture-number">03</span>
                    <span><strong>Scroll</strong><small>Drag with two fingers</small></span>
                </div>
                <div class="gesture-item">
                    <span class="gesture-number">04</span>
                    <span><strong>Right click</strong><small>Tap with two fingers</small></span>
                </div>
            </div>
        </footer>
    </main>

    <script src="cursor.js"></script>
</body>
</html>
